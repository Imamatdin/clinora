name: Clinora checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_USER: clinora_test
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: clinora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinora_test -d clinora_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://clinora_test:ci-synthetic-only@127.0.0.1:5432/clinora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # Task 024: two synthetic years; every report operation must answer in under 2 s on this runner.
      - run: npm run test:load
      - run: npm run build
      - run: npm run test:built
      - run: npm run test:browser
      - run: node --import tsx scripts/check-provision.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-evidence
          path: |
            work/browser-evidence/
            work/browser-results/**/*.png
          if-no-files-found: ignore
  windows-compatibility:
    # Pull requests only (docs/INCREMENTS.md speed rules); Linux runs on every push.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:built
