name: Notebook checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: notebook-${{ github.ref }}
  cancel-in-progress: true
jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_USER: clinora_test
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: clinora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinora_test -d clinora_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://clinora_test:ci-synthetic-only@127.0.0.1:5432/clinora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - name: Capture reviewed replay authorization failures
        if: github.ref_name == 'task-002-patient-notebook' || github.head_ref == 'task-002-patient-notebook'
        run: |
          git fetch --no-tags --depth=1 origin b348991c87363eda79d30f983b7d46478dda9105
          node scripts/check-replay-before.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: node --import tsx scripts/check-provision.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-evidence
          path: |
            work/browser-evidence/
            work/browser-results/**/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-before-fix-proof
          path: work/task-002a-before.log
          if-no-files-found: ignore
  windows-compatibility:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:built
