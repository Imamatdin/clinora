# Cloud Run service template. CI fills ${...} with envsubst (explicit variable list) and applies it
# with `gcloud run services replace`. Traffic moves to the new revision only after its startup
# probe (/readyz: database reachable + migrations current) passes; otherwise the old revision serves.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE}
  labels:
    app: clinora
    env: staging
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      labels:
        app: clinora
        commit: ${COMMIT_LABEL}
      annotations:
        # Task 024: assistant transcription and drafting run in-process after the HTTP response. With
        # request-based billing Cloud Run throttles CPU between requests and those jobs stall, so CPU
        # stays allocated (instance-based billing) and one instance is always warm (also no cold start
        # at opening time). Cost at Tier 1 list price (1 vCPU, 512 MiB, us-central1, Nov 2026):
        # 2.63M vCPU-s x $0.000018 + 1.31M GiB-s x $0.000002, minus the instance free tier, about
        # USD 45 per month for the minimum instance; a second instance costs the same rate while it runs.
        # Re-check https://cloud.google.com/run/pricing for the chosen region.
        run.googleapis.com/cpu-throttling: 'false'
        autoscaling.knative.dev/minScale: '1'
        # pool max 8 per instance x 2 instances + migration job stays under db-g1-small's connection limit.
        autoscaling.knative.dev/maxScale: '2'
        run.googleapis.com/cloudsql-instances: ${SQL_CONNECTION}
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      serviceAccountName: ${RUNTIME_SA}
      containerConcurrency: 40
      # 300 s: the streamed full clinic export of two synthetic years took 22 s locally (task 024);
      # every other route is still bounded by the app's own limits (15 s request read, 10 s statements).
      timeoutSeconds: 300
      containers:
        - image: ${IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: APP_ENV
              value: staging
            - name: APP_ORIGIN
              value: https://${DOMAIN}
            - name: COOKIE_SECURE
              value: 'true'
            # Google's front end appends the real client address as the last X-Forwarded-For entry.
            - name: TRUST_PROXY_HOPS
              value: '1'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${DB_SECRET}
                  key: latest
            # @telegram-env: replaced by deploy.yml with the three TELEGRAM_* entries when the
            # repository variable GCP_TELEGRAM_BOT_USERNAME is set (task 004 requires all three or none).
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
  traffic:
    - latestRevision: true
      percent: 100
